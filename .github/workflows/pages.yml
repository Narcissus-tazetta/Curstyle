name: pages

on:
    push:
        branches: [main]
        paths: [site/**, docs/appcast.xml, .github/workflows/pages.yml]
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: read
        outputs:
            artifact_name: ${{ steps.artifact.outputs.name }}
        steps:
            - uses: actions/checkout@v4.4.0

            - uses: oven-sh/setup-bun@v2.2.0

            - name: Build
              working-directory: site
              run: |
                  bun install --frozen-lockfile
                  bun run build

            - uses: actions/configure-pages@v5.0.0

            # Full reruns retain artifacts from earlier attempts of the same run.
            - id: artifact
              run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-pages-artifact@v3.0.1
              with:
                  name: ${{ steps.artifact.outputs.name }}
                  path: site/build

    # The artifact may not be visible to deploy-pages immediately after upload.
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4.0.5
              with:
                  artifact_name: ${{ needs.build.outputs.artifact_name }}
