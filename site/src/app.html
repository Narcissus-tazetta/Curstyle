<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icon.svg" />
    <meta name="color-scheme" content="dark" />
    <script>
      // English is the default for everyone; only an explicit choice from the language switch
      // sends a visitor to /ja/. Runs before first paint to avoid a flash of English.
      if ("%lang%" === "en") {
        try {
          if (localStorage.getItem("lang") === "ja") location.replace("ja/" + location.hash);
        } catch {
          // Storage can be blocked; the visitor simply stays on the English page.
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
